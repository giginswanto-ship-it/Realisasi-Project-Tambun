version: '3.8'

services:
  # ==========================================
  # 1. DATABASE ENGINE: PostgreSQL 16
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: tambun-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tambun_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/prisma/migrations/20261104000000_init/migration.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./packages/database/prisma/seeds/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tambun-network

  # ==========================================
  # 2. OBJECT STORAGE: MinIO S3 Compatible
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: tambun-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - tambun-network

  # ==========================================
  # 3. BACKEND CORE ENGINE: NestJS API
  # ==========================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: tambun-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tambun_db?schema=public
      JWT_SECRET: super-secret-jwt-key-for-tambun-monitoring-system-2026
      JWT_EXPIRATION: 1d
      CORS_ORIGIN: "http://localhost:3000"
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: tambun-receipts
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
    ports:
      - "4000:4000"
    networks:
      - tambun-network

  # ==========================================
  # 4. FRONTEND DASHBOARD: Next.js 14
  # ==========================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: tambun-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    networks:
      - tambun-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  tambun-network:
    driver: bridge
